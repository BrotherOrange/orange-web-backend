spring:
  profiles:
    active: secret
  application:
    name: person-website
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


mybatis:
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 显示SQL日志
  mapper-locations: classpath*:dao/*.xml  # mapper文件位置
  type-aliases-package: com.richard.website.infrastructure.po  # 实体类包路径